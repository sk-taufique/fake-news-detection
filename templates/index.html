<!DOCTYPE html>
<html>
<head>
    <title>Fake News Detector</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f4f7;
            text-align: center;
            padding-top: 60px;
        }

        .container {
            background-color: white;
            width: 600px;
            margin: auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }

        h1 {
            color: #222;
        }

        textarea {
            width: 90%;
            height: 180px;
            padding: 15px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            margin-top: 20px;
            padding: 12px 30px;
            font-size: 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        .result {
            margin-top: 25px;
            font-size: 22px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>📰 Fake News Detector</h1>

        <p>Enter a news article below:</p>

        <form method="POST">

            <textarea name="news"
                placeholder="Enter news article here..."
                required></textarea>

            <br>

            <button type="submit">Check News</button>

        </form>

        {% if prediction %}
            <div class="result">
                {{ prediction }}
            </div>
        {% endif %}

    </div>

</body>
</html>
